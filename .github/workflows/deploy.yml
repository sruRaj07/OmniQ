name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  ACR_NAME: omniqregistry
  RESOURCE_GROUP: OmniQ-Backend
  CONTAINER_APP_ENV: omniq-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 4000
          - service: product-service
            port: 4001
          - service: admin-service
            port: 4006
          - service: location-service
            port: 4005
          - service: order-service
            port: 4002
          - service: seller-service
            port: 4003
          - service: user-service
            port: 4004
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          docker build --build-arg SERVICE_NAME=${{ matrix.service }} -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          # Also tag and push as latest
          LATEST_TAG=${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:latest
          docker tag $IMAGE_TAG $LATEST_TAG
          docker push $LATEST_TAG

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.ACR_NAME }}.azurecr.io
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          containerAppName: ${{ matrix.service }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          ingress: external
          targetPort: ${{ matrix.port }}
          environmentVariables: >-
            REDIS_URL=${{ secrets.REDIS_URL }}
            EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            PORT=${{ matrix.port }}
            PRODUCT_SERVICE_URL=https://product-service.redbay-317d5a3d.eastus.azurecontainerapps.io
            ORDER_SERVICE_URL=https://order-service.redbay-317d5a3d.eastus.azurecontainerapps.io
            LOCATION_SERVICE_URL=https://location-service.redbay-317d5a3d.eastus.azurecontainerapps.io
            SELLER_SERVICE_URL=https://seller-service.redbay-317d5a3d.eastus.azurecontainerapps.io
            ADMIN_SERVICE_URL=https://admin-service.redbay-317d5a3d.eastus.azurecontainerapps.io
            USER_SERVICE_URL=https://user-service.redbay-317d5a3d.eastus.azurecontainerapps.io
